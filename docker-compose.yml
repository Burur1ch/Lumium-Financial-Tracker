services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumium
      POSTGRES_USER: lumium
      POSTGRES_PASSWORD: lumium
    ports:
      - "5432:5432"
    volumes:
      - lumium-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumium -d lumium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumium-postgres: